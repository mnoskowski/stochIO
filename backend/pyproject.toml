[project]
name = "StochIO-api"
version = "0.1.0"
description = ""
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.136.1",
    "fsrs>=6.3.1",
    "pydantic-settings>=2.14.1",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.12.1",
    "sqlalchemy[asyncio]>=2.0.49",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "mypy>=2.4.1",
    "ruff>=0.17.4",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.ruff]
target-version="py312"

[tool.ruff.lint]
select=[
    "E",
    "F",
    "I",
    "ASYNC",
    "UP",
    "B"
]

[tool.pyright]
venv=".venv"
pythonVersion = "3.12"

# Standard type checking, strictness adjusted below.
typeCheckingMode = "standard"

# Developed on OSX
pythonPlatform = "Darwin"

# Ensure there's no Any returned/accepted in route handlers
reportUnknownParameterType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownReturnType = "warning"

# Strict rules for data serialization
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
analyzeUnannotatedFunctions = true

[tool.pytest.ini_options]
# Auto so every test runs without a decorator
asyncio_mode="auto"